<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap">
<style>
/* Página de gracias · {{NOMBRE_DEL_EVENTO}}. Fondo oscuro, una sola tarjeta con un solo botón. Sin animaciones ni scripts. */
html,body,.hl_page-preview--content{background:#0E182C!important}
.jdg{
  --blue:#0038FF; --blue-dark:#002FD6; --sky:#8FBAFF; --royal:#172742;
  font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',system-ui,sans-serif;
  color:#fff;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;
}
.jdg *,.jdg *::before,.jdg *::after{box-sizing:border-box}
.jdg h1,.jdg p{margin:0;padding:0}
.jdg .wrap{min-height:85vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.jdg .card{width:100%;max-width:620px;background:var(--royal);border:1px solid rgba(143,186,255,.28);border-radius:20px;padding:36px 22px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.jdg .check{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:2rem;font-weight:800;color:#fff;box-shadow:0 4px 12px rgba(0,56,255,.4)}
.jdg .tag{font-family:'Space Grotesk','Plus Jakarta Sans',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:.8rem;color:var(--sky)}
.jdg h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;line-height:1.12;letter-spacing:-.02em;font-size:clamp(1.8rem,7.4vw,2.6rem);margin-top:8px;text-wrap:balance;color:#fff}
.jdg .lead{margin-top:16px;color:rgba(255,255,255,.86);font-size:1.08rem}
.jdg .btn{display:block;margin-top:26px;min-height:54px;padding:15px 18px;background:var(--blue);color:#fff!important;text-decoration:none;font-weight:800;font-size:1.08rem;line-height:1.3;border-radius:10px;box-shadow:0 3px 8px rgba(0,56,255,.3)}
.jdg .btn:hover{background:var(--blue-dark)}
.jdg .btn:active{transform:translateY(1px)}
.jdg :focus-visible{outline:3px solid #4D85FF;outline-offset:3px}
.jdg .ps{margin-top:16px;font-size:.92rem;color:rgba(255,255,255,.74);line-height:1.5}
@media (min-width:720px){
  .jdg{font-size:18px}
  .jdg .card{padding:48px 44px}
}
</style>
