<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap">
<style>
/* Landing v2 · {{NOMBRE_DEL_EVENTO}}. Sin animaciones continuas, sin scripts de terceros en el HTML. */
.jda{
  --blue:#0038FF; --blue-dark:#002FD6; --blue-bright:#4D85FF; --sky:#8FBAFF;
  --navy:#0E182C; --navy-deep:#070D1B; --royal:#172742;
  --bg:#FFFFFF; --bg-soft:#F1F9FF;
  --ink:#0E182C; --ink-2:#45536E; --muted:#5A6680; --line:#E3EAF4;
  --card:#FFFFFF;
  --f-sans:'Plus Jakarta Sans',-apple-system,'Segoe UI',system-ui,sans-serif;
  --f-data:'Space Grotesk','Plus Jakarta Sans',sans-serif;
  background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:17px;line-height:1.6;
  color-scheme:light;-webkit-text-size-adjust:100%;
}
.jda *,.jda *::before,.jda *::after{box-sizing:border-box}
.jda h1,.jda h2,.jda h3,.jda p,.jda ul,.jda ol{margin:0;padding:0}
.jda ul,.jda ol{list-style:none}
.jda h1,.jda h2,.jda h3{font-family:var(--f-sans);font-weight:800;line-height:1.12;letter-spacing:-.02em;text-wrap:balance;color:inherit}
.jda h2{font-size:clamp(1.65rem,6.6vw,2.4rem)}
.jda :focus-visible{outline:3px solid var(--blue-bright);outline-offset:3px}
.jda [hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.jda #registro{scroll-margin-top:12px}

.jda .band{padding-block:56px}
.jda .soft{background:var(--bg-soft)}
.jda .dark{background:var(--navy);color:#fff;--ink:#fff;--ink-2:rgba(255,255,255,.82);--muted:rgba(255,255,255,.7);--line:rgba(143,186,255,.28);--card:var(--royal)}
.jda .in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.jda .in.w{max-width:1000px}
.jda .tag{font-family:var(--f-data);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;color:var(--blue)}
.jda .dark .tag{color:var(--sky)}
.jda .lead{color:var(--ink-2);font-size:1.08rem}
.jda .micro{font-size:.84rem;color:var(--muted);line-height:1.45}

/* botón */
.jda .btn{display:block;width:100%;font-family:var(--f-sans);font-weight:800;font-size:1.08rem;background:var(--blue);color:#fff;border:0;border-radius:10px;min-height:54px;padding:12px 18px;cursor:pointer;text-align:center;text-decoration:none;line-height:1.3;box-shadow:0 3px 8px rgba(0,56,255,.3)}
.jda .btn:hover{background:var(--blue-dark)}
.jda .btn:active{transform:translateY(1px)}

/* 1. hero */
.jda .hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);padding-block:22px 40px}
.jda .live{font-family:var(--f-data);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--sky);display:flex;gap:8px;align-items:center}
.jda .dot{width:9px;height:9px;border-radius:50%;background:var(--blue-bright)}
.jda .hero h1{font-size:clamp(1.7rem,7.6vw,2.9rem);margin-top:10px}
.jda .hero h1 em{font-style:normal;color:var(--sky)}
.jda .hero .sub{margin-top:10px;color:rgba(255,255,255,.85);font-size:1rem;line-height:1.45}
.jda .board{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(143,186,255,.3);border:1px solid rgba(143,186,255,.3);border-radius:10px;overflow:hidden;margin-top:16px}
.jda .board>div{background:var(--royal);padding:9px 10px}
.jda .board .full{grid-column:1/-1;padding:9px 14px}
.jda .board .k{font-family:var(--f-data);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.66rem;color:var(--sky)}
.jda .board .v{font-family:var(--f-data);font-weight:700;font-size:1.05rem;color:#fff;line-height:1.3}
.jda .board .full .v{font-size:1.2rem}
.jda .cta-wrap{margin-top:28px}
.jda .hero .cta-wrap{margin-top:18px}
.jda .hero.has-img{padding-bottom:0;overflow:hidden}
.jda .hero-img{display:block;width:100%;max-width:460px;height:auto;margin:20px auto 0}
.jda .photo{display:block;width:100%;max-width:420px;aspect-ratio:4/5;object-fit:cover;border-radius:16px;margin:26px auto 0}
.jda .photo-ph{background:#FFF3C4;color:#6b4300;border:2px dashed #d9a400;font-weight:700;display:grid;place-items:center;text-align:center;padding:16px}

/* problema + camino */
.jda .two{display:grid;gap:14px;margin-top:24px}
.jda .card{background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.jda .card h3{font-size:1.2rem;color:var(--blue);margin-bottom:10px}
.jda .card p{color:var(--ink-2)}
.jda .card p+p{margin-top:10px}
.jda .trio{display:grid;gap:12px;margin-top:24px}
.jda .trio div{border-left:4px solid var(--blue);padding:2px 0 2px 14px;color:var(--ink-2)}
.jda .trio b{display:block;font-family:var(--f-data);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;color:var(--blue);margin-bottom:2px}
.jda .scen{display:grid;gap:12px;margin-top:24px}
.jda .math{border:2px dashed var(--blue-bright);background:#fff;border-radius:14px;padding:18px;display:grid;gap:6px}
.jda .math .eq{font-family:var(--f-data);font-weight:700;font-size:1.3rem;line-height:1.25;color:var(--ink)}
.jda .math .eq i{font-style:normal;color:var(--blue)}

/* 2. lo que descubrirás */
.jda .rounds{display:grid;gap:14px;margin-top:24px}
.jda .round{display:grid;grid-template-columns:auto 1fr;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.jda .round>div{min-width:0}
.jda .n{font-family:var(--f-data);font-weight:700;background:var(--blue);color:#fff;border-radius:10px;width:48px;height:48px;display:grid;place-items:center;font-size:1.25rem}
.jda .round h3{font-size:1.15rem;margin-bottom:6px}
.jda .round p{color:var(--ink-2);font-size:.98rem}

/* 3. quién está detrás */
.jda .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px;text-align:center}
.jda .facts strong{display:block;font-family:var(--f-data);font-weight:700;font-size:clamp(1.25rem,5.4vw,1.9rem);color:var(--sky);line-height:1.15}
.jda .facts span{font-size:.8rem;color:var(--ink-2);line-height:1.3;display:block;margin-top:2px}

.jda .why{margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
.jda .why h3{font-size:1.4rem}
.jda .why .facts{margin-top:20px}
.jda .creds{display:grid;gap:10px;margin-top:24px}
.jda .creds li{position:relative;padding-left:30px;color:var(--ink-2)}
.jda .creds li::before{content:"✓";position:absolute;left:0;top:0;font-weight:800;color:var(--sky)}
.jda .aboutgrid{display:block}
.jda .slider{margin-top:40px}
.jda .slider .tag{margin-bottom:12px}
.jda .track{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;border-radius:14px}
.jda .track::-webkit-scrollbar{display:none}
.jda .slide{flex:0 0 88%;scroll-snap-align:start;margin:0}
.jda .slide img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:var(--pos,50% 28%);border-radius:14px;background:var(--royal)}
.jda .dots{display:flex;gap:10px;justify-content:center;margin-top:14px}
.jda .dots button{position:relative;width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(143,186,255,.35);cursor:pointer}
.jda .dots button::after{content:"";position:absolute;inset:-8px}
.jda .dots button[aria-current="true"]{background:var(--sky)}

/* 4. formulario */
.jda .formcard{background:#fff;color:var(--ink);border-radius:14px;padding:18px;margin:24px auto 0;max-width:480px;box-shadow:0 4px 14px rgba(0,56,255,.15)}
.jda .formcard iframe{display:block;width:100%;height:450px;border:0;border-radius:3px}
.jda .center{text-align:center}
.jda .when{font-family:var(--f-data);font-weight:700;color:var(--blue);margin-top:14px;font-size:1rem;line-height:1.4}

footer.jdaf{background:var(--navy-deep);color:rgba(255,255,255,.7);font-size:.78rem;line-height:1.5;text-align:center;padding:16px 16px 76px}

footer.jdaf a{color:#fff;text-decoration:underline;text-underline-offset:3px}
footer.jdaf a:hover{color:var(--sky)}

/* barra fija móvil */
.jda .sticky{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -4px 12px rgba(14,24,44,.12);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.jda .sticky .btn{max-width:640px;margin:0 auto;min-height:50px}

/* ===== TABLET / DESKTOP CHICO (≥ 720px) ===== */
@media (min-width:720px){
  .jda{font-size:18px}
  .jda .band{padding-block:72px}
  .jda .herogrid{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center}
  .jda .photo{margin-top:0}
  .jda .hero.has-img .herogrid{align-items:end}
  .jda .hero.has-img .herogrid>div:first-child{padding-bottom:56px}
  .jda .hero-img{max-width:none;width:calc(100% + 40px);margin:0 0 0 -40px}
  .jda .herogrid.solo{grid-template-columns:1fr;max-width:760px;margin:0 auto}
  .jda .two,.jda .scen{grid-template-columns:1fr 1fr}
  .jda .rounds{grid-template-columns:1fr 1fr}
  .jda .rounds .round:last-child:nth-child(odd){grid-column:1/-1}
  .jda .slide{flex-basis:44%}
  footer.jdaf{padding:14px 16px}
  .jda .sticky{display:none!important}
}

/* ===== DESKTOP (≥ 1024px) ===== */
@media (min-width:1024px){
  .jda{font-size:19px}
  .jda .in,.jda .in.w{max-width:1120px}
  .jda .band{padding-block:88px}
  .jda .hero{padding-block:64px 72px}
  .jda .herogrid{gap:64px}
  .jda .hero-img{width:calc(100% + 100px);margin-left:-70px}
  .jda .hero h1{font-size:3.2rem}
  .jda .hero .sub{font-size:1.15rem}
  .jda .board .v{font-size:1.25rem}
  .jda .board .full .v{font-size:1.4rem}
  .jda h2{font-size:2.6rem}
  .jda .in>.lead,.jda .in>.micro{max-width:760px}
  .jda .trio{grid-template-columns:repeat(3,1fr);gap:24px}
  .jda .two,.jda .scen{gap:24px}
  .jda .card{padding:26px}
  .jda .rounds{gap:20px}
  .jda .round{padding:26px}
  .jda .cta-wrap .btn{display:inline-block;width:auto;min-width:340px}
  .jda .aboutgrid{display:grid;grid-template-columns:1.15fr 1fr;grid-template-areas:"text media" "cta media";column-gap:64px;align-items:start}
  .jda .aboutgrid .about{grid-area:text}
  .jda .aboutgrid .slider{grid-area:media;margin-top:0}
  .jda .aboutgrid .cta-wrap{grid-area:cta}
  .jda .facts strong{font-size:1.7rem;white-space:nowrap}
  .jda .creds{grid-template-columns:1fr 1fr;gap:12px 28px}
  .jda .slide{flex-basis:100%}
  .jda .track{gap:16px}
  .jda .formcard{padding:28px}
}
@media (min-width:1200px){
  .jda .hero-img{width:calc(100% + 130px)}
}
</style>
